[project]
name = "overact"
version = "0.1.0"
description = "Pack, generate and validate .overact activity-schedule files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "polars>=1.20",
    "pyarrow>=17",
]

[project.scripts]
overact-pack = "overact.pack:main"
overact-synth = "overact.synth:main"
overact-validate = "overact.validate:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overact"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
