[package]
name = "overact-ingest"
description = "Read CSV / Parquet activity and attribute tables straight into an overact dataset"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
overact-core = { path = "../overact-core" }
csv-core = "0.1"
parquet = { version = "60", default-features = false, features = ["zstd", "snap", "flate2-zlib-rs", "lz4", "simdutf8"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
