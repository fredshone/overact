[package]
name = "overact-wasm"
description = "WASM bindings for overact-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Multi-threaded build (needs nightly, atomics and a cross-origin isolated page).
parallel = ["overact-core/parallel", "dep:wasm-bindgen-rayon", "dep:rayon"]

[dependencies]
overact-core = { path = "../overact-core" }
overact-ingest = { path = "../overact-ingest" }
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.10", optional = true }
wasm-bindgen = "=0.2.129"
serde_json = "1"
js-sys = "0.3"
