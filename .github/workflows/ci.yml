name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p overact-core --features parallel --all-targets -- -D warnings
      - run: cargo clippy -p overact-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p overact-core --features parallel --release
      - name: Native benchmark (demo dataset, prints the budget table)
        # Benches run from the crate dir; the default file is the demo dataset.
        run: cargo bench -p overact-core --bench engine

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      # overact-pack is the Rust packer; the Python wrapper builds it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p overact-ingest --bin overact-pack
        working-directory: .
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Nightly toolchain for the threaded build
        run: rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
      - run: scripts/build-wasm.sh --threads
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: web/test-results
